# Replaces the base image's /etc/apache2/mods-available/mpm_prefork.conf.
#
# With mod_php every prefork worker is a full PHP process, so the worker count
# is what drives the container's memory use. The upstream defaults (150 workers
# that are never recycled) can grow far past a small droplet's RAM.
#
# Values come from environment variables so they can be tuned per deployment
# without rebuilding; defaults are set with ENV in the Dockerfile.
# Rough sizing: MaxRequestWorkers ~= (container RAM - opcache - ~100M) / worker RSS.

<IfModule mpm_prefork_module>
	StartServers             ${APACHE_START_SERVERS}
	MinSpareServers          ${APACHE_MIN_SPARE_SERVERS}
	MaxSpareServers          ${APACHE_MAX_SPARE_SERVERS}
	MaxRequestWorkers        ${APACHE_MAX_REQUEST_WORKERS}
	# Recycle workers periodically so memory fragmented by large Moodle
	# requests is handed back to the OS instead of accumulating forever.
	MaxConnectionsPerChild   ${APACHE_MAX_CONNECTIONS_PER_CHILD}
</IfModule>
